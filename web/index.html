<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Immich TV is an open source, TV-first Immich client for browsing your self-hosted photo and video library on Android TV, Google TV, and the web."
  >
  <meta
    name="keywords"
    content="Immich TV, Immich Android TV, Immich Google TV, self-hosted photos, photo library TV app, open source photo viewer, Flutter TV app"
  >
  <meta name="robots" content="index, follow">
  <meta name="author" content="Immich TV">
  <meta name="theme-color" content="#071014">
  <link rel="canonical" href="https://immichtvapp.web.app/">
  <meta property="og:site_name" content="Immich TV">
  <meta property="og:title" content="Immich TV | Self-hosted photo browsing for Android TV">
  <meta
    property="og:description"
    content="Browse your self-hosted Immich photo and video library from the couch with a remote-friendly Android TV and Google TV client."
  >
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://immichtvapp.web.app/">
  <meta property="og:image" content="assets/png/banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Immich TV | Self-hosted photo browsing for Android TV">
  <meta
    name="twitter:description"
    content="A TV-first, open source Immich client for Android TV, Google TV, and web previews."
  >
  <meta name="twitter:image" content="assets/png/banner.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Immich TV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Immich TV | Self-hosted photo browsing for Android TV</title>
  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Immich TV",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Android TV, Google TV, Web",
      "description": "Open source, TV-first Immich client for browsing a self-hosted photo and video library.",
      "url": "https://immichtvapp.web.app/",
      "downloadUrl": "https://play.google.com/store/apps/details?id=com.workwithafridi.immichtv",
      "softwareVersion": "1.2.0",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "isAccessibleForFree": true,
      "codeRepository": "https://github.com/WorkWithAfridi/immich-tv"
    }
  </script>
</head>
<body>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #071014;
    }

    body {
      color: #f4faf8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #boot-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at top, rgba(145, 221, 197, 0.16), transparent 32%),
        linear-gradient(180deg, #071014 0%, #0b171c 100%);
    }

    #boot-card {
      width: min(100%, 420px);
      padding: 24px;
      border: 1px solid rgba(123, 146, 154, 0.5);
      border-radius: 20px;
      background: rgba(7, 16, 20, 0.88);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.28);
    }

    #boot-title {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    #boot-status {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(244, 250, 248, 0.8);
    }
  </style>
  <div id="boot-shell">
    <div id="boot-card">
      <h1 id="boot-title">Immich TV</h1>
      <p id="boot-status">Loading the web app…</p>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
