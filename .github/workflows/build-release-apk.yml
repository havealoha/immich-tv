name: Build Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-apk-master
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          version_name="${version_line%%+*}"
          build_number="${version_line##*+}"
          build_version="${version_name}+${build_number}"
          apk_name="ImmichTV.v${version_name}-${build_number}.apk"

          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name "${{ steps.version.outputs.version_name }}"
          --build-number "${{ steps.version.outputs.build_number }}"

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}"

      - name: Remove older APK assets from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$(gh api "repos/${{ github.repository }}/releases/tags/master-latest" 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            exit 0
          fi

          while IFS= read -r asset_id; do
            if [ -n "$asset_id" ]; then
              gh api \
                --method DELETE \
                "repos/${{ github.repository }}/releases/assets/${asset_id}"
            fi
          done < <(
            printf '%s' "$release_json" | jq -r '.assets[] | select(.name | endswith(".apk")) | .id'
          )

      - name: Publish GitHub release assets
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: master-latest
          target_commitish: ${{ github.sha }}
          name: Latest master build
          body: |
            Signed master build for Immich TV.

            Build version: `${{ steps.version.outputs.build_version }}`
            Version: `${{ steps.version.outputs.version_name }}`
            Build: `${{ steps.version.outputs.build_number }}`
            Commit: `${{ github.sha }}`
          generate_release_notes: false
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          fail_on_unmatched_files: true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
