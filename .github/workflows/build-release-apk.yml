name: Build Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-apk-master
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          version_name="${version_line%%+*}"
          build_number="${version_line##*+}"
          apk_name="ImmichTV-${version_name}-${build_number}.apk"
          latest_apk_name="ImmichTV-latest.apk"

          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
          echo "latest_apk_name=${latest_apk_name}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name "${{ steps.version.outputs.version_name }}"
          --build-number "${{ steps.version.outputs.build_number }}"

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}"
          cp "build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}" \
            "build/app/outputs/flutter-apk/${{ steps.version.outputs.latest_apk_name }}"

      - name: Publish GitHub release assets
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: master-latest
          target_commitish: ${{ github.sha }}
          name: Latest master build
          body: |
            Signed master build for Immich TV.

            Version: `${{ steps.version.outputs.version_name }}`
            Build: `${{ steps.version.outputs.build_number }}`
            Commit: `${{ github.sha }}`
          generate_release_notes: false
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
            build/app/outputs/flutter-apk/${{ steps.version.outputs.latest_apk_name }}
          fail_on_unmatched_files: true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
